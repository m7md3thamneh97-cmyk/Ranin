name: Voice Enrollment CI

on:
  pull_request:
    branches:
      - work/voice-enrollment-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Python dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Python suite
        run: python -m pytest -q
      - name: PCM WAV encoder assertions
        run: node tests/wav_encoder.mjs
      - name: Syntax-check enrollment browser modules
        run: |
          node --check studio/static/enroll.js
          node --check studio/static/vapi-frame.js
