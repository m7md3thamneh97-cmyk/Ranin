name: Voice Enrollment CI

on:
  pull_request:
    branches:
      - work/voice-enrollment-v1
      - work/rve-guided-platform-v1
      - work/conversation-studio-frontend
      - work/learning-backend-integrated
      - deploy/render-staging
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Python dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Install audio validation dependency
        timeout-minutes: 3
        run: |
          # Keep transient package mirrors from stalling the validation job.
          sudo tee /etc/apt/apt.conf.d/99-raneen-ci-timeouts > /dev/null <<'APT'
          Acquire::Retries "0";
          Acquire::http::Timeout "20";
          Acquire::https::Timeout "20";
          APT
          if ! command -v ffmpeg >/dev/null; then
            sudo sed -i -E 's#https?://azure\.archive\.ubuntu\.com/ubuntu#https://archive.ubuntu.com/ubuntu#g' /etc/apt/sources.list.d/ubuntu.sources
            sudo apt-get update
            sudo apt-get install --yes ffmpeg
          fi
      - name: Python suite
        run: python -m pytest -q
      - name: PCM WAV encoder assertions
        run: node tests/wav_encoder.mjs
      - name: Enrollment capture and recovery assertions
        run: node tests/enrollment_capture.mjs
      - name: Conversation event and learning contract assertions
        run: node tests/conversation_events.mjs
      - name: Tester access credential handoff assertions
        run: node tests/tester_access_ui.mjs
      - name: Syntax-check enrollment browser modules
        run: |
          node --check studio/static/enroll.js
          node --check studio/static/vapi-frame.js
          for module in studio/static/enrollment-*.js; do node --check "$module"; done
          for module in studio/static/conversation-*.js studio/static/learning-api.js; do node --input-type=module --check < "$module"; done
          node --input-type=module --check < studio/static/tester-access-ui.js
      - name: Install synthetic browser test dependencies
        timeout-minutes: 4
        run: |
          python -m pip install -r requirements-browser.txt
          python -m playwright install --with-deps chromium --only-shell
      - name: Guided enrollment browser smoke
        env:
          RANEEN_UI_OUTPUT_DIR: ${{ runner.temp }}/raneen-enrollment-ui
        run: python tests/enrollment_dom.py
      - name: Save synthetic interface screenshots
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: enrollment-interface-synthetic
          path: ${{ runner.temp }}/raneen-enrollment-ui
          if-no-files-found: ignore
          retention-days: 7
